name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs of this workflow on the same ref. Pushing a new commit
# to a PR makes the previous run irrelevant — saving runner time and giving
# faster feedback.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Required by vcpkg's GitHub Actions binary-cache backend (`x-gha`) so it can
  # read and write the cache without explicit auth tokens — see vcpkg docs:
  # https://learn.microsoft.com/vcpkg/users/binarycaching#gha
  actions: read

env:
  # vcpkg binary caching via the GitHub Actions cache backend. Without this,
  # every CI run rebuilds Qt from source (~30-45 minutes per OS). With it, the
  # first push warms the cache (~50 minutes total across the matrix) and every
  # push afterwards finishes in a few minutes per OS.
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  build-test:
    name: ${{ matrix.os }} (${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            preset: ci-linux
            triplet: x64-linux
          - os: macos-14
            preset: ci-macos
            triplet: arm64-osx
          - os: windows-2022
            preset: ci-windows
            triplet: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so `git describe --tags` works for ProjectVersion.cmake

      - name: Verify Ninja is on PATH
        # GitHub-hosted runner images preinstall Ninja on all three OSes; this
        # step is just a sanity check so a missing ninja shows up early.
        run: ninja --version

      # Linux-only: Qt's runtime needs OpenGL + xkbcommon + dbus headers to
      # build. macOS / Windows runners ship with everything Qt needs.
      - name: Install Qt build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-cursor-dev \
            libxcb-glx0-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-util-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrender-dev \
            libdbus-1-dev \
            xvfb

      # Windows-only: set up MSVC's developer-command-prompt environment so
      # cl.exe and the Windows SDK are on PATH for the cmake / vcpkg invocations
      # that follow. Without this, the Windows leg fails with the misleading
      # "CMake was unable to find a build program corresponding to Ninja" —
      # Ninja IS on PATH, it's the C++ compiler that's missing.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Bootstrap vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'b322364f06308bdd24823f9d8f03fe0cc86fd46f'
          # Don't auto-run install — CMake's manifest-mode integration kicks
          # vcpkg off as part of configure.

      # Forwards the GitHub-Actions cache tokens that vcpkg's `x-gha` backend
      # needs. Sets ACTIONS_CACHE_URL and ACTIONS_RUNTIME_TOKEN for subsequent
      # steps. Strictly necessary for binary caching to work.
      - name: Forward GitHub Actions cache tokens to vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Configure
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Linux's offscreen Qt platform plugin needs xvfb-run to provide a fake
      # display server; macOS and Windows runners have a real session and run
      # the same tests directly.
      - name: Test (Linux, under xvfb-run)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Test (macOS / Windows)
        if: runner.os != 'Linux'
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
