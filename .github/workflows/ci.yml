name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs of this workflow on the same ref. Pushing a new commit
# to a PR makes the previous run irrelevant — saving runner time and giving
# faster feedback.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # vcpkg's `x-gha` binary-cache backend in `readwrite` mode needs `actions:
  # write` (not `read`). With only `read`, vcpkg silently fails to populate
  # the cache — every run rebuilds Qt from source, ~1h per OS. See vcpkg docs:
  # https://learn.microsoft.com/vcpkg/users/binarycaching#gha
  actions: write

env:
  # vcpkg binary caching via the GitHub Actions cache backend. Without this,
  # every CI run rebuilds Qt from source (~30-45 minutes per OS). With it, the
  # first push warms the cache (~50 minutes total across the matrix) and every
  # push afterwards finishes in a few minutes per OS.
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  build-test:
    name: ${{ matrix.os }} (${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            preset: ci-linux
            triplet: x64-linux
          - os: macos-14
            preset: ci-macos
            triplet: arm64-osx
          - os: windows-2022
            preset: ci-windows
            triplet: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so `git describe --tags` works for ProjectVersion.cmake

      - name: Verify runner toolchain
        # GitHub-hosted runner images preinstall Ninja on all three OSes; we
        # also print the architecture so the macos-14 runner is visibly arm64
        # in the log (catches cases where the runner image silently swaps).
        run: |
          ninja --version
          echo "uname:"
          uname -a || echo "uname not available"

      # macos-14 runners ship a recent SDK (Xcode 15+); some vcpkg ports —
      # double-conversion is the canonical example — fail to configure unless
      # MACOSX_DEPLOYMENT_TARGET is explicit. Pinning to 12.0 also matches
      # Qt 6.5+'s minimum supported macOS.
      - name: Pin macOS deployment target
        if: runner.os == 'macOS'
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> $GITHUB_ENV
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=12.0" >> $GITHUB_ENV

      # Linux-only: Qt's runtime needs OpenGL + xkbcommon + dbus headers, and
      # several vcpkg ports (libb2, etc.) need GNU autotools at build time.
      # macOS / Windows runners ship with most of what Qt needs but the
      # autotools install step below covers libb2 on macOS too.
      - name: Install Qt build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            pkg-config \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-cursor-dev \
            libxcb-glx0-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-util-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrender-dev \
            libdbus-1-dev \
            xvfb

      # macOS: some vcpkg ports (libb2 in particular) require autotools at
      # build time. Xcode CLI Tools ship autoconf and automake but not
      # autoconf-archive; install via brew defensively. Also install
      # coreutils for `gtimeout`, which the GUI smoke test uses (macOS does
      # not ship GNU `timeout` anywhere on PATH).
      - name: Install autotools + coreutils (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf autoconf-archive automake libtool coreutils

      # Windows-only: redirect vcpkg's buildtrees to a short root path. Without
      # this, qtdeclarative's deeply-nested build paths exceed MAX_PATH on
      # Windows runners and cl.exe fails with "Cannot open compiler generated
      # file: '': Invalid argument" (a misleading rendition of path-too-long).
      - name: Redirect vcpkg buildtrees to short path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\b | Out-Null
          New-Item -ItemType Directory -Force -Path C:\d | Out-Null
          New-Item -ItemType Directory -Force -Path C:\p | Out-Null
          Add-Content $env:GITHUB_ENV "VCPKG_DEFAULT_BUILDTREES_ROOT=C:\b"
          Add-Content $env:GITHUB_ENV "VCPKG_DEFAULT_DOWNLOADS_ROOT=C:\d"
          Add-Content $env:GITHUB_ENV "VCPKG_DEFAULT_PACKAGES_ROOT=C:\p"

      # Windows-only: set up MSVC's developer-command-prompt environment so
      # cl.exe and the Windows SDK are on PATH for the cmake / vcpkg invocations
      # that follow. Without this, the Windows leg fails with the misleading
      # "CMake was unable to find a build program corresponding to Ninja" —
      # Ninja IS on PATH, it's the C++ compiler that's missing.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Bootstrap vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # Pinned to a recent vcpkg master that includes double-conversion
          # 3.4.0 — earlier baselines shipped 3.3.0 which fails to configure
          # on macos-14 arm64 inside vcpkg-parallel-configure. The same
          # commit must be set as `builtin-baseline` in vcpkg.json so port
          # versions agree with this checkout.
          vcpkgGitCommitId: 'd29e8309d1cf7a7cb6998a935b2ac5b1958a7432'
          # Don't auto-run install — CMake's manifest-mode integration kicks
          # vcpkg off as part of configure.

      # Forwards the GitHub-Actions cache tokens that vcpkg's `x-gha` backend
      # needs. Sets ACTIONS_CACHE_URL and ACTIONS_RUNTIME_TOKEN for subsequent
      # steps. Strictly necessary for binary caching to work.
      - name: Forward GitHub Actions cache tokens to vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # One-line diagnostics so a future "the cache isn't populating" debug
      # session takes one log read instead of a guess. Prints whether the
      # tokens were forwarded and which binary-source spec vcpkg will use.
      - name: Verify vcpkg binary-cache configuration
        run: |
          echo "VCPKG_BINARY_SOURCES=${VCPKG_BINARY_SOURCES:-(unset)}"
          echo "ACTIONS_CACHE_URL set: ${ACTIONS_CACHE_URL:+yes}${ACTIONS_CACHE_URL:-no}"
          echo "ACTIONS_RUNTIME_TOKEN set: ${ACTIONS_RUNTIME_TOKEN:+yes}${ACTIONS_RUNTIME_TOKEN:-no}"
        shell: bash

      - name: Configure
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Linux's offscreen Qt platform plugin needs xvfb-run to provide a fake
      # display server; macOS and Windows runners have a real session and run
      # the same tests directly.
      - name: Test (Linux, under xvfb-run)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Test (macOS / Windows)
        if: runner.os != 'Linux'
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
